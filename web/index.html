<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Athena — WhatsApp Demo</title>

<!--
  ATHENA — WHATSAPP-STYLE DEMO CHANNEL
  ============================================================
  A concept demo, not a WhatsApp Business API integration. This page
  calls the exact same POST /report endpoint athena.js does (same
  {text, language} body, same response contract) -- no separate
  pipeline, no separate backend route. It exists to show "the same
  Athena brain works inside a familiar chat interface a rural/first-
  time user might already trust," nothing more. Deliberately not
  wired to real WhatsApp infrastructure (no Business API, no webhook,
  no phone number) -- out of scope for the time this project has.

  Standalone, no build step, same convention as athena.html/js/css --
  open this file directly in a browser (or serve it statically) with
  the FastAPI server running on localhost:8000. CORS on the backend
  is wide open (allow_origins=["*"]), same as the main app relies on.
-->

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #0b141a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  /* Phone frame -- keeps the illusion contained to a device-shaped
     card instead of stretching WhatsApp's mobile UI across a full
     desktop viewport. */
  .phone {
    width: 420px;
    max-width: 100%;
    height: 780px;
    max-height: 92vh;
    background: #e5ddd5;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ================= HEADER ================= */

  .header {
    background: #075e54;
    color: #fff;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .header .back {
    font-size: 22px;
    opacity: 0.9;
  }

  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #fff;
    color: #075e54;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    flex-shrink: 0;
  }

  .header-info { flex: 1; min-width: 0; }

  .header-name {
    font-size: 16px;
    font-weight: 600;
  }

  .header-status {
    font-size: 12.5px;
    opacity: 0.85;
    height: 16px;
  }

  .header-icons {
    display: flex;
    gap: 18px;
    font-size: 18px;
    opacity: 0.9;
  }

  /* ================= CHAT AREA ================= */

  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 14px 10px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    background-image:
      linear-gradient(rgba(229, 221, 213, 0.97), rgba(229, 221, 213, 0.97)),
      repeating-linear-gradient(45deg, #d9d0c4 0, #d9d0c4 1px, transparent 1px, transparent 16px);
  }

  .row {
    display: flex;
    margin: 5px 4px;
  }

  .row.out { justify-content: flex-end; }
  .row.in { justify-content: flex-start; }
  .row.sys { justify-content: center; margin: 10px 4px; }

  .bubble {
    max-width: 78%;
    padding: 7px 9px 8px 10px;
    font-size: 14px;
    line-height: 1.4;
    color: #111;
    position: relative;
    box-shadow: 0 1px 0.5px rgba(0, 0, 0, 0.13);
  }

  .bubble.out {
    background: #dcf8c6;
    border-radius: 8px 8px 0 8px;
  }

  .bubble.in {
    background: #ffffff;
    border-radius: 8px 8px 8px 0;
  }

  .bubble .text {
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .meta {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 3px;
    margin-top: 2px;
    font-size: 10.5px;
    color: #667781;
  }

  .meta .tick { color: #53bdeb; font-size: 13px; }

  .listen-btn {
    border: none;
    background: none;
    font-size: 12px;
    cursor: pointer;
    padding: 0 4px 0 0;
    line-height: 1;
  }

  .listen-btn:disabled { cursor: default; opacity: 0.6; }

  .sys-pill {
    background: #e1f2fb;
    color: #4a5b64;
    font-size: 11.5px;
    padding: 5px 10px;
    border-radius: 8px;
    text-align: center;
    max-width: 85%;
  }

  .tag {
    display: inline-block;
    margin-top: 6px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 2px 7px;
    border-radius: 4px;
  }

  .tag.Critical { background: #fde2e1; color: #c62828; }
  .tag.High     { background: #ffe8cc; color: #b5560c; }
  .tag.Medium   { background: #fff6cc; color: #8a6d00; }
  .tag.Low      { background: #dff5df; color: #2e7d32; }

  .voice-bubble {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .voice-bubble audio {
    height: 32px;
    width: 220px;
  }

  .voice-bubble .mic-badge {
    font-size: 15px;
    flex-shrink: 0;
  }

  .evidence-image {
    max-width: 220px;
    max-height: 220px;
    border-radius: 6px;
    display: block;
  }

  .typing-row { padding-left: 4px; }

  .typing-bubble {
    background: #fff;
    border-radius: 8px 8px 8px 0;
    padding: 10px 14px;
    display: inline-flex;
    gap: 4px;
    box-shadow: 0 1px 0.5px rgba(0, 0, 0, 0.13);
  }

  .typing-bubble span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #9aa5aa;
    animation: bounce 1.2s infinite;
  }

  .typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* ================= COMPOSER ================= */

  .composer {
    flex-shrink: 0;
    background: #f0f0f0;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .composer .icon {
    font-size: 21px;
    color: #54656f;
    flex-shrink: 0;
  }

  .composer input {
    flex: 1;
    border: none;
    outline: none;
    background: #fff;
    border-radius: 22px;
    padding: 11px 16px;
    font-size: 14.5px;
    font-family: inherit;
  }

  .send-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #075e54;
    color: #fff;
    border: none;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
  }

  .send-btn:active { transform: scale(0.95); }

  .disclaimer {
    text-align: center;
    font-size: 10px;
    color: #6b7c85;
    padding: 4px 30px 2px;
    background: #e5ddd5;
  }
</style>
</head>
<body>

<div class="phone">

  <div class="header">
    <span class="back">‹</span>
    <div class="avatar">✦</div>
    <div class="header-info">
      <div class="header-name">Athena Helpline</div>
      <div class="header-status" id="headerStatus">online</div>
    </div>
    <div class="header-icons">
      <select id="langToggle" title="Interface language" style="font-size:13px;border:none;border-radius:6px;background:rgba(255,255,255,0.15);color:#fff;padding:2px 4px;">
        <option value="en">EN</option>
        <option value="hi">हिं</option>
        <option value="te">తె</option>
        <option value="ur">اردو</option>
        <option value="bn">বাং</option>
      </select>
      <span>📹</span>
      <span>📞</span>
      <span onclick="window.location.href='/dashboard.html'" title="Open counsellor dashboard" style="cursor:pointer;">⋮</span>
    </div>
  </div>

  <div class="chat" id="chat">
    <div class="row sys">
      <div class="sys-pill" id="sysDisclaimer"></div>
    </div>
  </div>

  <div class="disclaimer" id="disclaimer" style="display:none;"></div>

  <div class="composer">
    <span class="icon">😊</span>
    <span class="icon" onclick="document.getElementById('imageInput').click()" title="Attach a photo as evidence" style="cursor:pointer;">📎</span>
    <input
      id="imageInput"
      type="file"
      accept="image/*"
      style="display:none;"
      onchange="sendImageEvidence(this.files[0]); this.value='';"
    />
    <span class="icon" onclick="sendVoiceNote()" title="Send demo voice note" style="cursor:pointer;">🎤</span>
    <input
      id="msgInput"
      type="text"
      placeholder="Type a message"
      onkeydown="if(event.key==='Enter') sendMessage();"
    />
    <button class="send-btn" onclick="sendMessage()" id="sendBtn">➤</button>
  </div>

</div>

<script>

  // Same endpoint, same request shape as athena.js's submitReport() --
  // this is deliberately not a separate integration.
  const REPORT_ENDPOINT = "/report";

  const chat = document.getElementById("chat");
  const input = document.getElementById("msgInput");
  const headerStatus = document.getElementById("headerStatus");

  // Small, self-contained translation table for this page only --
  // deliberately not pulling in i18n.js (dashboard.html's shared
  // translation layer), matching this file's own "standalone, no
  // build step" design intent noted above. Same three UI languages as
  // the dashboard for now; extending this to a new language later is
  // just one more object below.
  const UI_STRINGS = {
    en: {
      headerName: "Athena Helpline",
      online: "online",
      typing: "typing…",
      disclaimer: "🔒 This is a concept demo. Messages are sent to Athena's safety pipeline — the same one the main app uses — not a real WhatsApp number.",
      placeholder: "Type a message",
    },
    hi: {
      headerName: "एथेना हेल्पलाइन",
      online: "ऑनलाइन",
      typing: "टाइप कर रहे हैं…",
      disclaimer: "🔒 यह एक कॉन्सेप्ट डेमो है। संदेश एथेना की सुरक्षा प्रणाली को भेजे जाते हैं — वही जो मुख्य ऐप उपयोग करता है — यह असली व्हाट्सऐप नंबर नहीं है।",
      placeholder: "संदेश टाइप करें",
    },
    te: {
      headerName: "ఎథీనా హెల్ప్‌లైన్",
      online: "ఆన్‌లైన్",
      typing: "టైప్ చేస్తున్నారు…",
      disclaimer: "🔒 ఇది ఒక కాన్సెప్ట్ డెమో. సందేశాలు ఎథీనా భద్రతా వ్యవస్థకు పంపబడతాయి — ప్రధాన యాప్ ఉపయోగించే అదే వ్యవస్థ — ఇది నిజమైన WhatsApp నంబర్ కాదు.",
      placeholder: "సందేశం టైప్ చేయండి",
    },
    ur: {
      headerName: "ایتھینا ہیلپ لائن",
      online: "آن لائن",
      typing: "ٹائپ کر رہے ہیں…",
      disclaimer: "🔒 یہ ایک تصوراتی ڈیمو ہے۔ پیغامات ایتھینا کے حفاظتی نظام کو بھیجے جاتے ہیں — وہی جو مرکزی ایپ استعمال کرتی ہے — یہ حقیقی واٹس ایپ نمبر نہیں ہے۔",
      placeholder: "پیغام ٹائپ کریں",
    },
    bn: {
      headerName: "এথীনা হেল্পলাইন",
      online: "অনলাইন",
      typing: "টাইপ করছে…",
      disclaimer: "🔒 এটি একটি ধারণাগত ডেমো। বার্তাগুলি এথীনার নিরাপত্তা ব্যবস্থায় পাঠানো হয় — মূল অ্যাপ যা ব্যবহার করে সেটিই — এটি প্রকৃত হোয়াটসঅ্যাপ নম্বর নয়।",
      placeholder: "বার্তা লিখুন",
    },
  };

  const langToggle = document.getElementById("langToggle");
  const sysDisclaimer = document.getElementById("sysDisclaimer");

  let currentUiLang = "en";

  function applyUiLanguage(lang) {
    currentUiLang = UI_STRINGS[lang] ? lang : "en";
    const strings = UI_STRINGS[currentUiLang];
    document.querySelector(".header-name").textContent = strings.headerName;
    headerStatus.textContent =
      headerStatus.dataset.state === "typing" ? strings.typing : strings.online;
    sysDisclaimer.textContent = strings.disclaimer;
    input.placeholder = strings.placeholder;
    try {
      localStorage.setItem("athena_ui_lang", currentUiLang);
    } catch (error) {
      // localStorage unavailable -- language still applies this load.
    }
  }

  if (langToggle) {
    let initialLang = "en";
    try {
      initialLang = localStorage.getItem("athena_ui_lang") || "en";
    } catch (error) {
      // default to English
    }
    langToggle.value = UI_STRINGS[initialLang] ? initialLang : "en";
    applyUiLanguage(langToggle.value);
    langToggle.addEventListener("change", () => applyUiLanguage(langToggle.value));
  }

  function escapeHTML(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function nowTime() {
    return new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  }

  function scrollChat() {
    chat.scrollTop = chat.scrollHeight;
  }

  function addOutgoing(text) {
    const row = document.createElement("div");
    row.className = "row out";
    row.innerHTML = `
      <div class="bubble out">
        <div class="text">${escapeHTML(text)}</div>
        <div class="meta">${nowTime()} <span class="tick">✓✓</span></div>
      </div>
    `;
    chat.appendChild(row);
    scrollChat();
  }

  function addIncoming(text, riskTier, escalateNote, language) {
    const row = document.createElement("div");
    row.className = "row in";

    const tag = riskTier
      ? `<div class="tag ${riskTier}">${riskTier} risk</div>`
      : "";

    const note = escalateNote
      ? `<div style="margin-top:6px;font-size:11px;color:#54656f;">${escapeHTML(escalateNote)}</div>`
      : "";

    // "Listen" playback is on-demand only (POST /tts), never fetched
    // automatically -- most responses are read, not played back, and
    // synthesis costs real latency/quota per call. Omitted entirely
    // when there's no real response text to read.
    const listenButton = text
      ? `<button class="listen-btn" onclick="playResponseAudio(this)" title="Listen to this response">🔊</button>`
      : "";

    row.innerHTML = `
      <div class="bubble in">
        <div class="text">${escapeHTML(text || "(no response)")}</div>
        ${tag}
        ${note}
        <div class="meta">${listenButton}${nowTime()}</div>
      </div>
    `;

    if (listenButton) {
      row.querySelector(".listen-btn").dataset.text = text;
      row.querySelector(".listen-btn").dataset.language = language || "en";
    }

    chat.appendChild(row);
    scrollChat();
  }

  // Single shared <audio> element so tapping a new "listen" button
  // stops whatever was already playing, instead of overlapping.
  const ttsPlayer = new Audio();

  async function playResponseAudio(button) {

    const text = button.dataset.text;
    const language = button.dataset.language;

    const original = button.textContent;
    button.textContent = "⏳";
    button.disabled = true;

    try {

      const response = await fetch("/tts", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text, language }),
      });

      if (!response.ok) {
        throw new Error(`TTS request failed: ${response.status}`);
      }

      const blob = await response.blob();
      ttsPlayer.src = URL.createObjectURL(blob);
      await ttsPlayer.play();

    } catch (error) {
      console.error("Playback failed:", error);
      // Text-to-speech is optional and may not be configured (see
      // tts_service.py) -- a failure here just means no audio, never
      // a broken page.
      button.textContent = "🔇";
      setTimeout(() => { button.textContent = original; }, 2000);
      button.disabled = false;
      return;
    }

    button.textContent = original;
    button.disabled = false;
  }

  function addSystemPill(text) {
    const row = document.createElement("div");
    row.className = "row sys";
    row.innerHTML = `<div class="sys-pill">${escapeHTML(text)}</div>`;
    chat.appendChild(row);
    scrollChat();
  }

  function showTyping() {
    const row = document.createElement("div");
    row.className = "row in typing-row";
    row.id = "typingRow";
    row.innerHTML = `
      <div class="typing-bubble">
        <span></span><span></span><span></span>
      </div>
    `;
    chat.appendChild(row);
    headerStatus.dataset.state = "typing";
    headerStatus.textContent = UI_STRINGS[currentUiLang].typing;
    scrollChat();
  }

  function removeTyping() {
    const row = document.getElementById("typingRow");
    if (row) row.remove();
    headerStatus.dataset.state = "online";
    headerStatus.textContent = UI_STRINGS[currentUiLang].online;
  }

  // Shared response handling for both the typed-message flow and the
  // voice-note flow -- everything after "the backend answered" is
  // identical regardless of which endpoint produced the answer.
  async function handlePipelineResponse(data) {

    removeTyping();

    const riskTier = data.risk ? data.risk.risk_tier : null;
    const language = data.incident ? data.incident.language : null;

    addIncoming(data.response, riskTier, null, language);

    if (data.case_id) {
      addSystemPill(
        `Case #${data.case_id} logged — ${data.case_status}` +
        (data.escalate ? " · flagged for human review" : "")
      );
    } else if (data.reason) {
      addSystemPill(data.reason);
    }

    // The AI's own text response is deliberately grounded only in
    // retrieved documents -- it won't state a helpline number unless
    // one turned up in that specific retrieval, so it can correctly
    // say "not verified" even though real national helplines always
    // exist. Surface those separately here from /call-options (a
    // hardcoded, always-available, real source) rather than loosening
    // what the AI itself is allowed to claim.
    if (riskTier === "Critical" || riskTier === "High") {
      try {
        const callOptionsResponse = await fetch("/call-options");
        const callOptions = await callOptionsResponse.json();
        if (callOptions && callOptions.length) {
          const lines = callOptions
            .map((option) => `${option.label}: ${option.phone}`)
            .join(" · ");
          addSystemPill(`📞 ${lines}`);
        }
      } catch (error) {
        console.error("Could not load call options:", error);
      }
    }
  }

  function handlePipelineNetworkError(error) {
    console.error("Backend connection error:", error);
    removeTyping();
    addIncoming(
      "I couldn't connect to the safety intelligence system. " +
      "Make sure the Athena backend is running on localhost:8000, then try again."
    );
  }

  async function submitToPipeline(text, language) {

    showTyping();

    let data;

    try {

      const response = await fetch(REPORT_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text, language: language || null }),
      });

      data = await response.json();

    } catch (error) {
      handlePipelineNetworkError(error);
      return;
    }

    await handlePipelineResponse(data);
  }

  // Real transcription (Groq-hosted Whisper, see voice_service.py) --
  // posts the actual audio to /report/voice, same as a real recorded
  // voice report would. No fake/hardcoded transcript involved: this
  // used to send a pre-written transcript straight to /report because
  // live transcription was billing-gated on OpenAI; that gap closed
  // 2026-08-29 (Groq's free-tier Whisper), so the demo now shows the
  // real pipeline end to end, including whichever script Whisper
  // actually transcribes into -- which is also why the AI's reply now
  // comes back in native-script Hindi instead of romanized: the reply
  // language logic matches whatever script the transcript is actually
  // in (see response_engine.py), and Whisper's native Hindi output is
  // Devanagari by default.
  async function submitVoiceToPipeline(audioUrl, language) {

    showTyping();

    let data;

    try {

      const audioBlob = await (await fetch(audioUrl)).blob();

      const formData = new FormData();
      formData.append("file", audioBlob, "voice-note.ogg");
      formData.append("language", language);

      const response = await fetch("/report/voice", {
        method: "POST",
        body: formData,
      });

      data = await response.json();

    } catch (error) {
      handlePipelineNetworkError(error);
      return;
    }

    await handlePipelineResponse(data);
  }

  async function sendMessage() {

    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    addOutgoing(text);

    await submitToPipeline(text, null);
  }

  // Demo voice note: a real, playable recording (not synthesized),
  // now transcribed for real via submitVoiceToPipeline() above -- the
  // audio bubble plays for real, and so does the transcription behind
  // it. Roughly: "Because of my caste I wasn't allowed into the
  // temple and was insulted in front of everyone. A crowd is now
  // surrounding my house."
  const DEMO_VOICE_NOTE = {
    file: "demo_audio/caste_harassment_hindi.ogg",
    language: "hi",
  };

  function addOutgoingVoice(file) {
    const row = document.createElement("div");
    row.className = "row out";
    row.innerHTML = `
      <div class="bubble out">
        <div class="voice-bubble">
          <span class="mic-badge">🎤</span>
          <audio controls src="${file}"></audio>
        </div>
        <div class="meta">${nowTime()} <span class="tick">✓✓</span></div>
      </div>
    `;
    chat.appendChild(row);
    scrollChat();
  }

  async function sendVoiceNote() {
    addOutgoingVoice(DEMO_VOICE_NOTE.file);
    await submitVoiceToPipeline(DEMO_VOICE_NOTE.file, DEMO_VOICE_NOTE.language);
  }

  function addOutgoingImage(imageUrl) {
    const row = document.createElement("div");
    row.className = "row out";
    row.innerHTML = `
      <div class="bubble out">
        <img class="evidence-image" src="${imageUrl}" alt="Evidence photo" />
        <div class="meta">${nowTime()} <span class="tick">✓✓</span></div>
      </div>
    `;
    chat.appendChild(row);
    scrollChat();
  }

  // Evidence upload: OCRs a screenshot (e.g. a threatening message) via
  // /report/image (ocr.py/EasyOCR) and runs the extracted text through
  // the same pipeline as a typed report -- this backend endpoint
  // already existed and worked, it just had no UI anywhere to reach it
  // from. `language` is an OCR script hint (en/hi/te only -- EasyOCR's
  // language-set support doesn't yet cover ur/bn here), not the same
  // thing as incident-language auto-detection, which still runs on
  // whatever text OCR extracts.
  async function submitImageToPipeline(file, language) {

    showTyping();

    let data;

    try {

      const formData = new FormData();
      formData.append("file", file);
      formData.append("language", language || "en");

      const response = await fetch("/report/image", {
        method: "POST",
        body: formData,
      });

      data = await response.json();

    } catch (error) {
      handlePipelineNetworkError(error);
      return;
    }

    await handlePipelineResponse(data);
  }

  function sendImageEvidence(file) {
    if (!file) return;

    const reader = new FileReader();
    reader.onload = async () => {
      addOutgoingImage(reader.result);
      await submitImageToPipeline(file, "en");
    };
    reader.readAsDataURL(file);
  }

</script>

</body>
