<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Athena — WhatsApp Demo</title>

<!--
  ATHENA — WHATSAPP-STYLE DEMO CHANNEL
  ============================================================
  A concept demo, not a WhatsApp Business API integration. This page
  calls the exact same POST /report endpoint athena.js does (same
  {text, language} body, same response contract) -- no separate
  pipeline, no separate backend route. It exists to show "the same
  Athena brain works inside a familiar chat interface a rural/first-
  time user might already trust," nothing more. Deliberately not
  wired to real WhatsApp infrastructure (no Business API, no webhook,
  no phone number) -- out of scope for the time this project has.

  Standalone, no build step, same convention as athena.html/js/css --
  open this file directly in a browser (or serve it statically) with
  the FastAPI server running on localhost:8000. CORS on the backend
  is wide open (allow_origins=["*"]), same as the main app relies on.
-->

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #0b141a;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  /* Phone frame -- keeps the illusion contained to a device-shaped
     card instead of stretching WhatsApp's mobile UI across a full
     desktop viewport. */
  .phone {
    width: 420px;
    max-width: 100%;
    height: 780px;
    max-height: 92vh;
    background: #e5ddd5;
    border-radius: 28px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* ================= HEADER ================= */

  .header {
    background: #075e54;
    color: #fff;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
  }

  .header .back {
    font-size: 22px;
    opacity: 0.9;
  }

  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #fff;
    color: #075e54;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 700;
    font-size: 16px;
    flex-shrink: 0;
  }

  .header-info { flex: 1; min-width: 0; }

  .header-name {
    font-size: 16px;
    font-weight: 600;
  }

  .header-status {
    font-size: 12.5px;
    opacity: 0.85;
    height: 16px;
  }

  .header-icons {
    display: flex;
    gap: 18px;
    font-size: 18px;
    opacity: 0.9;
  }

  /* ================= CHAT AREA ================= */

  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 14px 10px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    background-image:
      linear-gradient(rgba(229, 221, 213, 0.97), rgba(229, 221, 213, 0.97)),
      repeating-linear-gradient(45deg, #d9d0c4 0, #d9d0c4 1px, transparent 1px, transparent 16px);
  }

  .row {
    display: flex;
    margin: 5px 4px;
  }

  .row.out { justify-content: flex-end; }
  .row.in { justify-content: flex-start; }
  .row.sys { justify-content: center; margin: 10px 4px; }

  .bubble {
    max-width: 78%;
    padding: 7px 9px 8px 10px;
    font-size: 14px;
    line-height: 1.4;
    color: #111;
    position: relative;
    box-shadow: 0 1px 0.5px rgba(0, 0, 0, 0.13);
  }

  .bubble.out {
    background: #dcf8c6;
    border-radius: 8px 8px 0 8px;
  }

  .bubble.in {
    background: #ffffff;
    border-radius: 8px 8px 8px 0;
  }

  .bubble .text {
    white-space: pre-wrap;
    word-wrap: break-word;
  }

  .meta {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 3px;
    margin-top: 2px;
    font-size: 10.5px;
    color: #667781;
  }

  .meta .tick { color: #53bdeb; font-size: 13px; }

  .sys-pill {
    background: #e1f2fb;
    color: #4a5b64;
    font-size: 11.5px;
    padding: 5px 10px;
    border-radius: 8px;
    text-align: center;
    max-width: 85%;
  }

  .tag {
    display: inline-block;
    margin-top: 6px;
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.02em;
    padding: 2px 7px;
    border-radius: 4px;
  }

  .tag.Critical { background: #fde2e1; color: #c62828; }
  .tag.High     { background: #ffe8cc; color: #b5560c; }
  .tag.Medium   { background: #fff6cc; color: #8a6d00; }
  .tag.Low      { background: #dff5df; color: #2e7d32; }

  /* Deliberately NOT green. This badge means the system could not
     classify the report, which is a reason for a human to look -- not
     a reassurance. Colouring it like "Low" would tell a frightened
     person the opposite of what it means. */
  .tag.Uncertain { background: #e8eaf0; color: #43506b; }

  .voice-bubble {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .voice-bubble audio {
    height: 32px;
    width: 220px;
  }

  .voice-bubble .mic-badge {
    font-size: 15px;
    flex-shrink: 0;
  }

  .evidence-image {
    max-width: 220px;
    max-height: 220px;
    border-radius: 6px;
    display: block;
  }

  .typing-row { padding-left: 4px; }

  .typing-bubble {
    background: #fff;
    border-radius: 8px 8px 8px 0;
    padding: 10px 14px;
    display: inline-flex;
    gap: 4px;
    box-shadow: 0 1px 0.5px rgba(0, 0, 0, 0.13);
  }

  .typing-bubble span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #9aa5aa;
    animation: bounce 1.2s infinite;
  }

  .typing-bubble span:nth-child(2) { animation-delay: 0.15s; }
  .typing-bubble span:nth-child(3) { animation-delay: 0.3s; }

  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  /* ================= COMPOSER ================= */

  .composer {
    flex-shrink: 0;
    background: #f0f0f0;
    padding: 8px 10px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .composer .icon {
    font-size: 21px;
    color: #54656f;
    flex-shrink: 0;
    background: none;
    border: none;
    padding: 4px;
    min-width: 34px;
    min-height: 34px;
    cursor: pointer;
    line-height: 1;
  }

  .composer .icon:focus-visible {
    outline: 2px solid #075e54;
    outline-offset: 2px;
    border-radius: 8px;
  }

  /* Recording state: the mic turns into a stop control and the bar
     shows a live timer, so it's never ambiguous whether the mic is
     actually capturing -- the old button gave no feedback at all
     because it never recorded anything in the first place. */
  .composer .icon.recording {
    color: #d32f2f;
    animation: pulse-rec 1.2s ease-in-out infinite;
  }

  @keyframes pulse-rec {
    0%, 100% { opacity: 1; }
    50%      { opacity: .35; }
  }

  @media (prefers-reduced-motion: reduce) {
    .composer .icon.recording { animation: none; }
  }

  .rec-timer {
    flex-shrink: 0;
    color: #d32f2f;
    font-size: 12px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .composer input {
    flex: 1;
    border: none;
    outline: none;
    background: #fff;
    border-radius: 22px;
    padding: 11px 16px;
    font-size: 14.5px;
    font-family: inherit;
  }

  .send-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #075e54;
    color: #fff;
    border: none;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    cursor: pointer;
  }

  .send-btn:active { transform: scale(0.95); }

  .disclaimer {
    text-align: center;
    font-size: 10px;
    color: #6b7c85;
    padding: 4px 30px 2px;
    background: #e5ddd5;
  }

  /* Persistent demo bar. Previously the demo disclaimer was the first
     message in the chat, which meant it scrolled out of view the moment
     a conversation started -- exactly when a viewer most needs to know
     this is not a real service. */
  .demo-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: #fff4d6;
    border-bottom: 1px solid #e8d9a8;
    font-size: 11px;
    line-height: 1.35;
    color: #6b5a1e;
  }
  .demo-bar .demo-text { flex: 1; min-width: 0; }
  .demo-link {
    flex-shrink: 0;
    background: #6b5a1e;
    color: #fff;
    border: none;
    border-radius: 6px;
    padding: 6px 9px;
    font-size: 11px;
    font-family: inherit;
    cursor: pointer;
    min-height: 32px;
  }
  .demo-link:focus-visible { outline: 2px solid #1f6f4a; outline-offset: 2px; }

  /* One escalation block instead of three overlapping ones. Order is
     deliberate: what happened, what it means, what to do now. */
  .escalation-card {
    max-width: 85%;
    background: #fff;
    border-left: 3px solid #c77d17;
    border-radius: 8px;
    padding: 9px 11px;
    font-size: 12px;
    line-height: 1.45;
    color: #3b4a52;
    box-shadow: 0 1px 1px rgba(0,0,0,0.08);
  }
  .escalation-card .esc-title {
    font-weight: 600;
    color: #8a5a0b;
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 3px;
  }
  .escalation-card .esc-case {
    margin-top: 5px;
    font-size: 11px;
    color: #6b7c85;
  }
  .escalation-card .esc-monitor {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px solid #ececec;
    font-size: 11px;
    color: #54656f;
  }

  /* Emergency numbers as real one-tap links. 112 is visually primary
     because in a crisis it is the only one that matters first. */
  .emergency {
    max-width: 85%;
    background: #fff;
    border-radius: 8px;
    padding: 9px 11px;
    box-shadow: 0 1px 1px rgba(0,0,0,0.08);
  }
  .emergency .em-title {
    font-size: 11px;
    font-weight: 600;
    color: #54656f;
    margin-bottom: 7px;
  }
  .em-primary {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    min-height: 46px;
    background: #c62828;
    color: #fff;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    margin-bottom: 7px;
  }
  .em-primary:focus-visible { outline: 3px solid #1f6f4a; outline-offset: 2px; }
  .em-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .em-item {
    flex: 1 1 45%;
    min-height: 44px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 5px 8px;
    background: #f2f5f6;
    border-radius: 7px;
    text-decoration: none;
    color: #1f2c33;
  }
  .em-item:focus-visible { outline: 2px solid #1f6f4a; outline-offset: 2px; }
  .em-item .em-label { font-size: 10.5px; color: #54656f; }
  .em-item .em-number { font-size: 14px; font-weight: 600; }

  /* Which language the reporter is writing in, next to where they
     type it rather than buried in the header. */
  .composer-lang {
    font-size: 10px;
    color: #6b7c85;
    text-align: center;
    padding: 2px 0 4px;
    background: #f0f2f5;
  }
</style>
</head>
<body>

<div class="phone">

  <div class="header">
    <span class="back">‹</span>
    <div class="avatar">✦</div>
    <div class="header-info">
      <div class="header-name">Athena Helpline</div>
      <div class="header-status" id="headerStatus">online</div>
    </div>
    <div class="header-icons">
      <select
        id="langToggle"
        aria-label="Interface language"
        style="font-size:13px;border:none;border-radius:6px;background:rgba(255,255,255,0.15);color:#fff;padding:4px;min-height:32px;"
      >
        <option value="en">English</option>
        <option value="hi">हिंदी</option>
        <option value="te">తెలుగు</option>
        <option value="ur">اردو</option>
        <option value="bn">বাংলা</option>
      </select>

      <!-- The video icon was a bare <span> with no handler: a dead
           control on a crisis screen, which someone in danger will tap
           and get silence from. Removed. The phone icon now opens the
           real emergency numbers from /call-options instead of doing
           nothing. -->
      <button
        type="button"
        id="headerCallButton"
        onclick="showEmergencyNumbers()"
        aria-label="Show emergency phone numbers"
        style="background:none;border:none;color:#fff;font-size:17px;cursor:pointer;min-width:32px;min-height:32px;"
      >📞</button>
    </div>
  </div>

  <div class="demo-bar">
    <span aria-hidden="true">🔒</span>
    <span class="demo-text" id="demoBarText"></span>
    <button
      type="button"
      class="demo-link"
      id="counsellorViewButton"
      onclick="window.location.href='/dashboard.html'"
    ></button>
  </div>

  <div class="chat" id="chat"></div>

  <div class="disclaimer" id="disclaimer" style="display:none;"></div>

  <div class="composer-lang" id="composerLang"></div>

  <div class="composer">

    <button
      class="icon"
      type="button"
      onclick="sendVoiceNote()"
      title="Play the pre-recorded Hindi sample (works without a mic)"
      aria-label="Send the pre-recorded Hindi sample voice note"
    >🗂</button>

    <button
      class="icon"
      type="button"
      onclick="document.getElementById('imageInput').click()"
      title="Attach a photo as evidence"
      aria-label="Attach a photo as evidence"
    >📎</button>

    <input
      id="imageInput"
      type="file"
      accept="image/*"
      style="display:none;"
      onchange="sendImageEvidence(this.files[0]); this.value='';"
    />

    <button
      class="icon"
      type="button"
      id="recBtn"
      onclick="toggleRecording()"
      title="Record a voice note"
      aria-label="Record a voice note"
    >🎤</button>

    <span id="recTimer" class="rec-timer" hidden aria-hidden="true"></span>

    <input
      id="msgInput"
      type="text"
      placeholder="Type a message"
      aria-label="Type a message"
      onkeydown="if(event.key==='Enter') sendMessage();"
    />

    <button class="send-btn" onclick="sendMessage()" id="sendBtn" aria-label="Send message">➤</button>

  </div>

</div>

<script>

    ur: {

  function escapeHTML(str) {
    const div = document.createElement("div");
    div.textContent = str;

  function nowTime() {

  function addIncoming(text, riskTier, escalateNote) {
    const row = document.createElement("div");
    row.className = "row in";

    const tag = riskTier
      ? (riskTier === "Uncertain"
          ? `<div class="tag Uncertain">Not confidently understood — sent for human review</div>`
          : `<div class="tag ${riskTier}">${riskTier} risk</div>`)
      : "";

    const note = escalateNote
      ? `<div style="margin-top:6px;font-size:11px;color:#54656f;">${escapeHTML(escalateNote)}</div>`
      : "";

    row.innerHTML = `
      <div class="bubble in">
        <div class="text">${escapeHTML(text || "(no response)")}</div>

  // One block instead of three. Previously an uncertain, escalated
  // case produced a badge inside the bubble, a separate "Case #N
  // logged - Escalated - flagged for human review" pill, and a third
  // pill of run-together phone numbers -- the same fact told three
  // ways in three visual styles, for someone in distress to decode.
  //
  // Order here is deliberate: what happened, then what it means, then
  // what to do right now.
  function addEscalationCard(data, understoodConfidently) {
    const strings = UI_STRINGS[currentUiLang];

    const uncertain = !understoodConfidently;
    const title = uncertain ? strings.uncertainTitle : strings.escalatedTitle;
    const body = uncertain ? strings.uncertainBody : strings.escalatedBody;

    const caseLine = data.case_id
      ? `<div class="esc-case">${escapeHTML(
          strings.caseLogged.replace("{id}", data.case_id)

      : "";

    const row = document.createElement("div");
    row.className = "row sys";
    row.innerHTML =
      `<div class="escalation-card" role="status">` +
        `<div class="esc-title"><span aria-hidden="true">&#9873;</span>` +
        `${escapeHTML(title)}</div>` +
        `<div>${escapeHTML(body)}</div>` +
        caseLine +
        `<div class="esc-monitor">${escapeHTML(strings.noMonitor)}</div>` +
      `</div>`;
    chat.appendChild(row);

  // Real one-tap tel: links with 44px+ targets, rather than four
  // numbers flattened into a single line of unclickable text. 112 is
  // primary because in a crisis it is the only one that matters first.
  function renderEmergencyBlock(options) {
    const strings = UI_STRINGS[currentUiLang];

    const primary =
      options.find((option) => String(option.phone).trim() === "112") || options[0];
    const rest = options.filter((option) => option !== primary);

    const items = rest
      .map(
        (option) =>
          `<a class="em-item" href="tel:${encodeURIComponent(option.phone)}" ` +
          `aria-label="${escapeHTML(option.label)}, ${escapeHTML(option.phone)}">` +
          `<span class="em-label">${escapeHTML(option.label)}</span>` +
          `<span class="em-number">${escapeHTML(option.phone)}</span></a>`
      )
      .join("");

    const row = document.createElement("div");
    row.className = "row sys";
    row.innerHTML =
      `<div class="emergency">` +
        `<div class="em-title">${escapeHTML(strings.emergencyTitle)}</div>` +
        (primary
          ? `<a class="em-primary" href="tel:${encodeURIComponent(primary.phone)}" ` +
            `aria-label="${escapeHTML(strings.callEmergency)}">` +
            `<span aria-hidden="true">&#128222;</span>` +
            `${escapeHTML(strings.callEmergency)}</a>`
          : "") +
        `<div class="em-list">${items}</div>` +
      `</div>`;
    chat.appendChild(row);
    scrollChat();
  }

  // Wired to the header phone icon, which previously did nothing at
  // all. /call-options is a hardcoded, always-available real source --
  // it never depends on what retrieval happened to find.
  async function showEmergencyNumbers() {
    try {
      const response = await fetch("/call-options");
      if (!response.ok) throw new Error("HTTP " + response.status);
      const options = await response.json();
      if (options && options.length) {
        renderEmergencyBlock(options);
        return;
      }
    } catch (error) {
      console.error("Could not load call options:", error);
    }
    // Never leave the tap unanswered. 112 and 14566 are constants, not
    // something this endpoint has to be reachable to know.
    renderEmergencyBlock([
      { label: "Emergency", phone: "112" },
      { label: "NHAA helpline", phone: "14566" },
    ]);
  }

  // Shared response handling for both the typed-message flow and the
  // voice-note flow -- everything after "the backend answered" is
  // identical regardless of which endpoint produced the answer.
  async function handlePipelineResponse(data) {

    removeTyping();

    const riskTier = data.risk ? data.risk.risk_tier : null;

    // A tier computed from a report the system didn't confidently
    // understand is not a finding, and showing it as one is worse than
    // showing nothing: "Low risk" next to "flagged for human review" is
    // a contradiction, and the reassuring half is the half a frightened
    // person will believe. pipeline.py escalates on low understanding
    // confidence precisely because the classification can't be trusted
    // -- so when that's why this escalated, the badge says so instead.
    const understoodConfidently =
      !data.incident ||
      data.incident.confidence == null ||
      data.incident.confidence >= 60;

    const badgeTier =
      understoodConfidently ? riskTier : "Uncertain";

    addIncoming(data.response, badgeTier);

    if (data.escalate || !understoodConfidently) {
      addEscalationCard(data, understoodConfidently);
    } else if (data.case_id) {
      addSystemPill(
        UI_STRINGS[currentUiLang].caseLogged.replace("{id}", data.case_id)
      );
    } else if (data.reason) {
      addSystemPill(data.reason);
    }

    // The AI's own text response is deliberately grounded only in
    // retrieved documents -- it won't state a helpline number unless
    // one turned up in that specific retrieval, so it can correctly
    // say "not verified" even though real national helplines always
    // exist. Surface those separately here from /call-options (a
    // hardcoded, always-available, real source) rather than loosening
    // what the AI itself is allowed to claim.
    if (riskTier === "Critical" || riskTier === "High" || !understoodConfidently) {
      await showEmergencyNumbers();
    }
  }

  // Deliberately doesn't assume "backend not running on localhost" --
  // this page is served from whatever origin loaded it (a Railway URL
  // in production, localhost in dev), and REPORT_ENDPOINT/"/report/voice"
  // are relative, so they always hit that same origin. A TypeError here
  // means fetch itself failed (offline, DNS, CORS); anything else is a
  // real HTTP error status from a backend that IS reachable, so the two
  // need different messages or a real deployed-backend failure reads as
  // "you forgot to start your laptop server," which is actively
  // misleading during a live demo.
  function handlePipelineNetworkError(error) {
    console.error("Backend connection error:", error);
    removeTyping();

    const isNetworkFailure = error instanceof TypeError;

    addIncoming(
      isNetworkFailure
        ? `I couldn't reach the Athena backend at ${window.location.origin}. ` +
          "It may be waking up from a cold start -- wait a few seconds and try again."
        : `The Athena backend returned an error (${error.message}). Try again in a moment.`
    );
  }

  async function submitToPipeline(text, language) {

    showTyping();

    let data;

    try {

      const response = await fetch(REPORT_ENDPOINT, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text, language: language || null }),
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      data = await response.json();

    } catch (error) {
      handlePipelineNetworkError(error);
      return;
    }

    await handlePipelineResponse(data);
  }

  // Real transcription (Groq-hosted Whisper, see voice_service.py) --
  // posts the actual audio to /report/voice, same as a real recorded
  // voice report would. No fake/hardcoded transcript involved: this
  // used to send a pre-written transcript straight to /report because
  // live transcription was billing-gated on OpenAI; that gap closed
  // 2026-08-29 (Groq's free-tier Whisper), so the demo now shows the
  // real pipeline end to end, including whichever script Whisper
  // actually transcribes into -- which is also why the AI's reply now
  // comes back in native-script Hindi instead of romanized: the reply
  // language logic matches whatever script the transcript is actually
  // in (see response_engine.py), and Whisper's native Hindi output is
  // Devanagari by default.
  async function submitVoiceToPipeline(audioUrl, language) {

    showTyping();

    let data;

    try {

      const audioBlob = await (await fetch(audioUrl)).blob();

      const formData = new FormData();

      // Name the part after what the blob actually is -- a live
      // MediaRecorder capture is webm, not the ogg the bundled sample
      // is, and mislabelling it can throw off format sniffing.
      const isWebm = (audioBlob.type || "").includes("webm");
      formData.append(
        "file",
        audioBlob,
        isWebm ? "voice-note.webm" : "voice-note.ogg"
      );

      // Only send a language when one is actually known (the bundled
      // sample is tagged Hindi). FormData stringifies null into the
      // literal "null", which is not a language code -- for a live
      // recording we want the backend detecting it, not parsing that.
      if (language) {
        formData.append("language", language);
      }

      const response = await fetch("/report/voice", {
        method: "POST",
        body: formData,
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      data = await response.json();

    } catch (error) {
      handlePipelineNetworkError(error);
      return;
    }

    await handlePipelineResponse(data);
  }

  async function sendMessage() {

    const text = input.value.trim();
    if (!text) return;

    input.value = "";
    addOutgoing(text);

    await submitToPipeline(text, null);

  /* =========================================================
     LIVE VOICE RECORDING
     ---------------------------------------------------------
     The mic button used to just replay DEMO_VOICE_NOTE -- there was
     no recording on this page at all, so "the mic doesn't work" was
     accurate: nothing was ever captured. This is the same
     MediaRecorder flow the main dashboard uses (see athena.js
     startRecording), posting to the same /report/voice endpoint, so
     a recording made here goes through real transcription rather
     than a canned transcript.

     The pre-recorded sample stays on its own button: a live mic is
     unreliable on a stage (no permission, no device, room noise), and
     having a guaranteed-good sample to fall back on mid-demo is worth
     more than pretending the mic will always cooperate.
  ========================================================= */

  let mediaRecorder = null;
  let audioChunks = [];
  let recTimerInterval = null;
  let recStartedAt = null;

  function updateRecTimer() {
    const timer = document.getElementById("recTimer");
    if (!timer || !recStartedAt) return;
    const seconds = Math.floor((Date.now() - recStartedAt) / 1000);
    const mm = String(Math.floor(seconds / 60)).padStart(2, "0");
    const ss = String(seconds % 60).padStart(2, "0");
    timer.textContent = `${mm}:${ss}`;
  }

  function setRecordingUI(isRecording) {

    const button = document.getElementById("recBtn");
    const timer = document.getElementById("recTimer");

    if (button) {
      button.classList.toggle("recording", isRecording);
      button.textContent = isRecording ? "⏹" : "🎤";
      button.setAttribute(
        "aria-label",
        isRecording ? "Stop recording and send" : "Record a voice note"
      );
      button.title = isRecording
        ? "Stop recording and send"
        : "Record a voice note";
    }

    if (timer) {
      timer.hidden = !isRecording;
      if (!isRecording) timer.textContent = "";
    }

  }

  async function toggleRecording() {

    if (mediaRecorder && mediaRecorder.state === "recording") {
      stopRecording();
      return;
    }

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      addIncoming(
        "This browser can't record audio. You can type instead, or use the " +
        "sample voice note button."
      );
      return;
    }

    try {

      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

      audioChunks = [];
      mediaRecorder = new MediaRecorder(stream);

      mediaRecorder.ondataavailable = event => {
        if (event.data.size > 0) audioChunks.push(event.data);
      };

      mediaRecorder.onstop = async () => {

        stream.getTracks().forEach(track => track.stop());

        const audioBlob = new Blob(audioChunks, { type: "audio/webm" });

        // Nothing captured (instant stop, or a mic that produced no
        // data) -- say so rather than posting an empty file and
        // letting it fail confusingly downstream.
        if (!audioBlob.size) {
          addIncoming("That recording came out empty — please try again.");
          return;
        }

        const audioUrl = URL.createObjectURL(audioBlob);
        addOutgoingVoice(audioUrl);

        // Use whatever language the person already picked in the header
        // rather than letting the endpoint fall back to its "hi"
        // default -- someone who switched the interface to Telugu and
        // then spoke is almost certainly speaking Telugu.
        await submitVoiceToPipeline(audioUrl, currentUiLang);

      };

      mediaRecorder.start();

      recStartedAt = Date.now();
      updateRecTimer();
      recTimerInterval = setInterval(updateRecTimer, 500);

      setRecordingUI(true);

    } catch (error) {

      console.error("Microphone unavailable:", error);

      // Denied permission is the common case and is not an error state
      // worth a scary message -- it just needs an alternative.
      addIncoming(
        "I couldn't access the microphone. Check the browser's mic permission " +
        "for this site, or type your message instead."
      );

      setRecordingUI(false);

    }

  }

  function stopRecording() {

    if (mediaRecorder && mediaRecorder.state !== "inactive") {
      mediaRecorder.stop();
    }

    clearInterval(recTimerInterval);
    recTimerInterval = null;
    recStartedAt = null;

    setRecordingUI(false);

  }

  function addOutgoingImage(imageUrl) {

      <div class="bubble out">

  // Evidence upload: OCRs a screenshot (e.g. a threatening message) via
  // /report/image (ocr.py/EasyOCR) and runs the extracted text through
  // the same pipeline as a typed report -- this backend endpoint
  // already existed and worked, it just had no UI anywhere to reach it
  // from. `language` is an OCR script hint (en/hi/te only -- EasyOCR's
  // language-set support doesn't yet cover ur/bn here), not the same
  // thing as incident-language auto-detection, which still runs on
  // whatever text OCR extracts.
  async function submitImageToPipeline(file, language) {

    showTyping();

    let data;

    try {

      const formData = new FormData();
      formData.append("file", file);
      formData.append("language", language || "en");

      const response = await fetch("/report/image", {
        method: "POST",
        body: formData,
      });

      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      data = await response.json();

    } catch (error) {
      handlePipelineNetworkError(error);
      return;
    }

    await handlePipelineResponse(data);
  }

  function sendImageEvidence(file) {
    if (!file) return;

    const reader = new FileReader();
    reader.onload = async () => {
      addOutgoingImage(reader.result);
      await submitImageToPipeline(file, "en");
    };
    reader.readAsDataURL(file);
  }

</script>
